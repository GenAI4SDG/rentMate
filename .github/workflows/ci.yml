name: CI

# Runs on every push and pull request. Vercel/Render deploy from GitHub on their own;
# this just stops a broken build from reaching main unnoticed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Figma/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Figma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Figma/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  api:
    name: Map API (backend/server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
